<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>BR MUSIC</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================================
   BODY
========================================================= */

body {

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255, 0, 100, .10),
            transparent 30%
        ),

        radial-gradient(
            circle at 85% 30%,
            rgba(0, 220, 255, .08),
            transparent 30%
        ),

        #050505;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

header {

    width: 100%;

    padding:
        25px
        30px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    background:
        rgba(0,0,0,.35);

    backdrop-filter:
        blur(20px);

    position: sticky;

    top: 0;

    z-index: 20;
}


.header-inner {

    max-width: 1100px;

    margin: auto;

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 20px;
}


.logo {

    font-size: 25px;

    font-weight: 900;

    letter-spacing: 2px;

    background:
        linear-gradient(
            90deg,
            #ff0055,
            #7800ff,
            #00eaff
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}


.logo span {

    font-size: 10px;

    color: #777;

    display: block;

    letter-spacing: 4px;

    margin-top: 3px;

    -webkit-text-fill-color: #777;
}


/* =========================================================
   MAIN
========================================================= */

main {

    max-width: 1100px;

    margin: auto;

    padding:
        40px
        25px
        180px;
}


/* =========================================================
   SEARCH
========================================================= */

.search-box {

    width: 100%;

    height: 48px;

    display: flex;

    align-items: center;

    gap: 10px;

    padding:
        0 15px;

    margin-bottom: 35px;

    border-radius: 12px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.09);

    transition: .25s;
}


.search-box:focus-within {

    border-color:
        #00eaff;

    box-shadow:
        0 0 20px
        rgba(0,234,255,.10);
}


.search-icon {

    font-size: 17px;

    opacity: .7;
}


.search-box input {

    flex: 1;

    border: none;

    outline: none;

    background: transparent;

    color: white;

    font-size: 14px;
}


.search-box input::placeholder {

    color: #777;
}


/* =========================================================
   SECTION TITLE
========================================================= */

.section-heading {

    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-bottom: 18px;
}


.section-heading h2 {

    font-size: 18px;

    font-weight: 900;

    letter-spacing: 1px;
}


.section-heading span {

    font-size: 10px;

    letter-spacing: 1.5px;

    color: #777;
}


/* =========================================================
   ALBUM CONTAINER
========================================================= */

#albumView {

    display: block;
}


/* =========================================================
   ALBUM GRID
========================================================= */

.album-grid {

    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 15px;
}


/* =========================================================
   ALBUM CARD
========================================================= */

.album-card {

    position: relative;

    min-height: 170px;

    padding: 20px;

    border-radius: 20px;

    overflow: hidden;

    cursor: pointer;

    background:
        linear-gradient(
            135deg,
            rgba(255,0,85,.18),
            rgba(120,0,255,.14),
            rgba(0,234,255,.10)
        );

    border:
        1px solid
        rgba(255,255,255,.09);

    transition:
        transform .25s,
        border-color .25s,
        box-shadow .25s;
}


.album-card:hover {

    transform:
        translateY(-5px);

    border-color:
        #00eaff;

    box-shadow:
        0 10px 35px
        rgba(0,234,255,.13);
}


/* decorative circle */

.album-card::after {

    content: "";

    position: absolute;

    width: 100px;

    height: 100px;

    right: -35px;

    bottom: -35px;

    border-radius: 50%;

    background:
        rgba(0,234,255,.12);

    filter:
        blur(15px);
}


/* =========================================================
   ALBUM COVER
========================================================= */

.album-cover {

    width: 58px;

    height: 58px;

    border-radius: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    margin-bottom: 20px;

    font-size: 27px;

    background:
        linear-gradient(
            135deg,
            #ff0055,
            #7800ff,
            #00eaff
        );

    box-shadow:
        0 0 25px
        rgba(0,234,255,.25);
}


/* =========================================================
   ALBUM NAME
========================================================= */

.album-name {

    position: relative;

    z-index: 2;

    font-size: 16px;

    font-weight: 900;

    letter-spacing: .5px;
}


.album-count {

    position: relative;

    z-index: 2;

    margin-top: 7px;

    color: #888;

    font-size: 10px;

    letter-spacing: 1px;
}


/* =========================================================
   SONG VIEW
========================================================= */

#songView {

    display: none;
}


/* =========================================================
   BACK BUTTON
========================================================= */

.album-back {

    border: none;

    outline: none;

    background: transparent;

    color: #00eaff;

    cursor: pointer;

    font-size: 12px;

    font-weight: 800;

    margin-bottom: 18px;

    padding: 0;

    transition: .2s;
}


.album-back:hover {

    color: white;

    transform:
        translateX(-3px);
}


/* =========================================================
   MUSIC LIST
========================================================= */

.music-list {

    display: flex;

    flex-direction: column;

    gap: 10px;
}


/* =========================================================
   SONG CARD
========================================================= */

.song {

    min-height: 75px;

    display: flex;

    align-items: center;

    gap: 15px;

    padding:
        10px
        15px;

    border-radius: 13px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.06);

    cursor: pointer;

    transition: .2s;
}


.song:hover {

    background:
        rgba(255,255,255,.07);

    border-color:
        rgba(0,234,255,.25);
}


.song.active {

    border-color:
        rgba(255,0,204,.55);

    background:
        rgba(255,0,204,.06);
}


/* =========================================================
   SONG PLAY BUTTON
========================================================= */

.song-play {

    width: 42px;

    height: 42px;

    flex-shrink: 0;

    border: none;

    border-radius: 50%;

    cursor: pointer;

    color: white;

    background:
        linear-gradient(
            135deg,
            #ff0055,
            #7800ff
        );

    box-shadow:
        0 0 15px
        rgba(255,0,85,.18);

    font-size: 14px;
}


/* =========================================================
   SONG INFO
========================================================= */

.song-info {

    flex: 1;

    min-width: 0;
}


.song-title {

    font-size: 14px;

    font-weight: 800;

    white-space: nowrap;

    overflow: hidden;

    text-overflow: ellipsis;
}


.song-number {

    color: #666;

    font-size: 9px;

    letter-spacing: 1.2px;

    margin-top: 5px;
}


/* =========================================================
   VISUALIZER
========================================================= */

.visualizer {

    height: 28px;

    display: flex;

    align-items: center;

    gap: 3px;

    opacity: .2;
}


.song.active .visualizer {

    opacity: 1;
}


.visualizer i {

    display: block;

    width: 3px;

    height: 10px;

    border-radius: 4px;

    background:
        #00eaff;

    animation:
        wave .8s
        infinite
        ease-in-out;
}


.visualizer i:nth-child(2) {

    animation-delay: .15s;
}


.visualizer i:nth-child(3) {

    animation-delay: .3s;
}


.visualizer i:nth-child(4) {

    animation-delay: .45s;
}


@keyframes wave {

    0%,
    100% {

        height: 7px;
    }

    50% {

        height: 25px;
    }
}


/* =========================================================
   PLAYER
========================================================= */

.player {

    position: fixed;

    left: 0;

    right: 0;

    bottom: 0;

    z-index: 50;

    background:
        rgba(5,5,5,.88);

    backdrop-filter:
        blur(25px);

    border-top:
        1px solid
        rgba(255,255,255,.08);

    padding:
        15px
        20px;
}


.player-inner {

    max-width: 1100px;

    margin: auto;
}


/* =========================================================
   NOW PLAYING
========================================================= */

.now-playing {

    text-align: center;

    color: #777;

    font-size: 10px;

    letter-spacing: 1px;

    margin-bottom: 12px;
}


.now-playing strong {

    color: #00eaff;

    margin-left: 5px;
}


/* =========================================================
   PROGRESS
========================================================= */

.progress-area {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 13px;
}


.progress-area span {

    width: 35px;

    color: #777;

    font-size: 9px;

    text-align: center;
}


.progress-container {

    height: 5px;

    flex: 1;

    border-radius: 10px;

    cursor: pointer;

    background:
        rgba(255,255,255,.10);

    overflow: hidden;
}


.progress {

    width: 0%;

    height: 100%;

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #ff0055,
            #7800ff,
            #00eaff
        );
}


/* =========================================================
   CONTROLS
========================================================= */

.controls {

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 18px;
}


.control {

    width: 35px;

    height: 35px;

    border: none;

    background: transparent;

    color: white;

    cursor: pointer;

    font-size: 17px;

    opacity: .75;

    transition: .2s;
}


.control:hover {

    opacity: 1;

    transform:
        scale(1.08);
}


.control.main {

    width: 45px;

    height: 45px;

    border-radius: 50%;

    opacity: 1;

    background:
        linear-gradient(
            135deg,
            #ff0055,
            #7800ff,
            #00eaff
        );

    box-shadow:
        0 0 20px
        rgba(0,234,255,.15);
}


/* =========================================================
   VOLUME
========================================================= */

.volume {

    display: flex;

    align-items: center;

    gap: 8px;

    margin-left: 25px;

    color: #aaa;

    font-size: 13px;
}


.volume input {

    width: 80px;

    cursor: pointer;
}


/* =========================================================
   LOADING
========================================================= */

.loading {

    display: none;

    text-align: center;

    margin-top: 10px;

    color: #00eaff;

    font-size: 9px;

    letter-spacing: 2px;
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width: 700px) {

    .album-grid {

        grid-template-columns:
            repeat(2, 1fr);
    }

    .album-card {

        min-height: 145px;
    }

    .volume {

        display: none;
    }

    main {

        padding:
            25px
            15px
            170px;
    }
}


@media(max-width: 450px) {

    .album-grid {

        grid-template-columns:
            1fr;
    }

    .album-card {

        min-height: 130px;
    }

    .header-inner {

        padding: 0;
    }
}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="header-inner">

        <div class="logo">

            BR MUSIC

            <span>
                MUSIC PLAYER
            </span>

        </div>

    </div>

</header>


<!-- =========================================================
     MAIN
========================================================= -->

<main>


    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <div class="search-box">

        <span class="search-icon">
            🔍
        </span>

        <input
            id="search"
            type="text"
            placeholder="Cari judul musik..."
            autocomplete="off"
        >

    </div>



    <!-- =====================================================
         ALBUM VIEW
    ====================================================== -->

    <section
        id="albumView"
        style="display:block;"
    >

        <div class="section-heading">

            <h2>
                ALBUM MUSIK
            </h2>

            <span>
                PILIH ALBUM
            </span>

        </div>


        <div
            id="albumGrid"
            class="album-grid"
        ></div>

    </section>



    <!-- =====================================================
         SONG VIEW
    ====================================================== -->

    <section
        id="songView"
        style="display:none;"
    >

        <button
            id="albumBack"
            class="album-back"
        >

            ← KEMBALI KE ALBUM

        </button>


        <div class="section-heading">

            <h2
                id="albumSongTitle"
            >
                MUSIK
            </h2>

            <span
                id="albumSongCount"
            ></span>

        </div>


        <div
            id="musicList"
            class="music-list"
        ></div>

    </section>


</main>



<!-- =========================================================
     PLAYER
========================================================= -->

<div class="player">

    <div class="player-inner">


        <div class="now-playing">

            NOW PLAYING :

            <strong
                id="nowPlaying"
            >
                Belum ada musik
            </strong>

        </div>


        <!-- PROGRESS -->

        <div class="progress-area">

            <span
                id="currentTime"
            >
                0:00
            </span>


            <div
                class="progress-container"
                id="progressContainer"
            >

                <div
                    class="progress"
                    id="progress"
                ></div>

            </div>


            <span
                id="duration"
            >
                0:00
            </span>

        </div>


        <!-- CONTROLS -->

        <div class="controls">

            <button
                class="control"
                id="prev"
            >
                ⏮
            </button>


            <button
                class="control main"
                id="play"
            >
                ▶
            </button>


            <button
                class="control"
                id="next"
            >
                ⏭
            </button>


            <div class="volume">

                🔊

                <input
                    id="volume"
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.8"
                >

            </div>

        </div>


        <div
            class="loading"
            id="loading"
        >
            LOADING MUSIC...
        </div>


    </div>

</div>



<!-- =========================================================
     JAVASCRIPT
========================================================= -->

<script>


/* =========================================================
   DATA MUSIK
========================================================= */

/*
   CARA MENAMBAHKAN LAGU:

   {
       title: "NAMA LAGU",
       album: "NAMA ALBUM",
       audio: "music/nama-file.mp3"
   }

   Jika nama album belum ada,
   album baru otomatis muncul.
*/


const songs = [


    /* =====================================================
       ALBUM MUSIC INGGRIS
    ====================================================== */

    {
        title: "WHY DO I",

        album: "MUSIC INGGRIS",

        audio:
            "music/WHY DO I.mp3"
    },
      {
        title: "Hold On",

        album: "MUSIC INGGRIS",

        audio:
            "music/Hold on.mp3"
    },
      {
        title: "Be Alright",

        album: "MUSIC INGGRIS",

        audio:
            "music/Be Alright.mp3"
    },


    /* =====================================================
       ALBUM MUSIC INDONESIA
    ====================================================== */

    {
        title: "Ari Lesmana - Sesi Potret",

        album: "MUSIC INDONESIA",

        audio:
            "music/Ari Lesmana - Sesi Potret.mp3"
    },

    /* =====================================================
       ALBUM MUSIC DJ
    ====================================================== */

     {
        title: "DJ BOXING88",

        album: "MUSIC DJ",

        audio:
            "music/DJ BOXING88.mp3"
    }


];



/* =========================================================
   ELEMENT
========================================================= */


const albumView =
    document.getElementById(
        "albumView"
    );


const songView =
    document.getElementById(
        "songView"
    );


const albumGrid =
    document.getElementById(
        "albumGrid"
    );


const albumBack =
    document.getElementById(
        "albumBack"
    );


const albumSongTitle =
    document.getElementById(
        "albumSongTitle"
    );


const albumSongCount =
    document.getElementById(
        "albumSongCount"
    );


const musicList =
    document.getElementById(
        "musicList"
    );


const search =
    document.getElementById(
        "search"
    );


const audio =
    new Audio();


const playButton =
    document.getElementById(
        "play"
    );


const prevButton =
    document.getElementById(
        "prev"
    );


const nextButton =
    document.getElementById(
        "next"
    );


const nowPlaying =
    document.getElementById(
        "nowPlaying"
    );


const progress =
    document.getElementById(
        "progress"
    );


const progressContainer =
    document.getElementById(
        "progressContainer"
    );


const currentTime =
    document.getElementById(
        "currentTime"
    );


const duration =
    document.getElementById(
        "duration"
    );


const volume =
    document.getElementById(
        "volume"
    );


const loading =
    document.getElementById(
        "loading"
    );



/* =========================================================
   STATE
========================================================= */


let currentIndex = -1;

let selectedAlbum = null;



/* =========================================================
   FORMAT WAKTU
========================================================= */


function formatTime(seconds) {

    if (!isFinite(seconds)) {

        return "0:00";
    }


    const minutes =
        Math.floor(
            seconds / 60
        );


    const secs =
        Math.floor(
            seconds % 60
        );


    return (
        minutes +
        ":" +
        String(secs)
            .padStart(2, "0")
    );
}



/* =========================================================
   ALBUM
========================================================= */


/*
   Mengambil semua nama album
   tanpa duplikat.
*/

function getAlbums() {

    return [
        ...new Set(
            songs.map(
                song => song.album
            )
        )
    ];
}



/*
   Menampilkan semua album.
*/

function renderAlbums() {

    albumGrid.innerHTML = "";


    const albums =
        getAlbums();


    if (albums.length === 0) {

        albumGrid.innerHTML = `

            <div class="album-card">

                <div class="album-name">
                    BELUM ADA ALBUM
                </div>

            </div>

        `;

        return;
    }


    albums.forEach(
        (albumName) => {


            const albumSongs =
                songs.filter(
                    song =>
                        song.album ===
                        albumName
                );


            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "album-card";


            card.innerHTML = `

                <div
                    class="album-cover"
                >
                    ♫
                </div>


                <div
                    class="album-name"
                >
                    ${albumName}
                </div>


                <div
                    class="album-count"
                >
                    ${albumSongs.length}
                    MUSIK
                </div>

            `;


            card.addEventListener(
                "click",
                function() {

                    openAlbum(
                        albumName
                    );

                }
            );


            albumGrid.appendChild(
                card
            );

        }
    );

}



/*
   Membuka album.
*/

function openAlbum(
    albumName
) {

    selectedAlbum =
        albumName;


    const albumSongs =
        songs.filter(
            song =>
                song.album ===
                albumName
        );


    albumView.style.display =
        "none";


    songView.style.display =
        "block";


    albumSongTitle.textContent =
        albumName;


    albumSongCount.textContent =
        albumSongs.length +
        " MUSIK";


    renderSongs(
        albumSongs
    );

}



/*
   Kembali ke album.
*/

function closeAlbum() {

    selectedAlbum =
        null;


    songView.style.display =
        "none";


    albumView.style.display =
        "block";


    renderAlbums();

}



/* tombol kembali */

albumBack.addEventListener(
    "click",
    closeAlbum
);



/* =========================================================
   RENDER SONG
========================================================= */


function renderSongs(
    list
) {

    musicList.innerHTML =
        "";


    if (
        list.length === 0
    ) {

        musicList.innerHTML = `

            <div class="song">

                <div
                    class="song-info"
                >

                    <div
                        class="song-title"
                    >
                        🔍 Musik tidak ditemukan
                    </div>

                </div>

            </div>

        `;

        return;
    }


    list.forEach(
        function(song) {


            const originalIndex =
                songs.indexOf(
                    song
                );


            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "song";


            if (
                originalIndex ===
                currentIndex
            ) {

                item.classList.add(
                    "active"
                );

            }


            item.innerHTML = `

                <button
                    class="song-play"
                >

                    ${
                        originalIndex ===
                        currentIndex &&
                        !audio.paused

                        ? "❚❚"

                        : "▶"
                    }

                </button>


                <div
                    class="song-info"
                >

                    <div
                        class="song-title"
                    >

                        ${song.title}

                    </div>


                    <div
                        class="song-number"
                    >

                        TRACK

                        ${
                            String(
                                originalIndex + 1
                            ).padStart(
                                2,
                                "0"
                            )
                        }

                    </div>

                </div>


                <div
                    class="visualizer"
                >

                    <i></i>
                    <i></i>
                    <i></i>
                    <i></i>

                </div>

            `;


            item.addEventListener(
                "click",
                function() {


                    if (
                        currentIndex ===
                        originalIndex
                    ) {

                        togglePlay();

                    }

                    else {

                        loadSong(
                            originalIndex,
                            true
                        );

                    }

                }
            );


            musicList.appendChild(
                item
            );

        }
    );

}



/* =========================================================
   LOAD SONG
========================================================= */


function loadSong(
    index,
    autoPlay = false
) {

    if (
        index < 0 ||
        index >= songs.length
    ) {

        return;
    }


    currentIndex =
        index;


    const song =
        songs[
            currentIndex
        ];


    loading.style.display =
        "block";


    nowPlaying.textContent =
        song.title;


    audio.src =
        song.audio;


    audio.load();


    audio.volume =
        volume.value;


    renderSongs(
        selectedAlbum
            ? songs.filter(
                s =>
                    s.album ===
                    selectedAlbum
            )
            : songs
    );


    if (autoPlay) {

        audio.play()
            .then(
                function() {

                    playButton.textContent =
                        "❚❚";

                    loading.style.display =
                        "none";

                }
            )
            .catch(
                function(error) {

                    console.log(
                        error
                    );

                    loading.style.display =
                        "none";
                }
            );

    }

}



/* =========================================================
   PLAY / PAUSE
========================================================= */


function togglePlay() {

    if (
        currentIndex === -1
    ) {

        if (
            songs.length > 0
        ) {

            loadSong(
                0,
                true
            );

        }

        return;
    }


    if (
        audio.paused
    ) {

        audio.play()
            .then(
                function() {

                    playButton.textContent =
                        "❚❚";

                    renderSongs(
                        selectedAlbum
                            ? songs.filter(
                                s =>
                                    s.album ===
                                    selectedAlbum
                            )
                            : songs
                    );

                }
            )
            .catch(
                function(error) {

                    console.log(
                        error
                    );

                }
            );

    }

    else {

        audio.pause();

        playButton.textContent =
            "▶";


        renderSongs(
            selectedAlbum
                ? songs.filter(
                    s =>
                        s.album ===
                        selectedAlbum
                )
                : songs
        );

    }

}



/* =========================================================
   PLAY BUTTON
========================================================= */


playButton.addEventListener(
    "click",
    togglePlay
);



/* =========================================================
   PREVIOUS
========================================================= */


prevButton.addEventListener(
    "click",
    function() {


        if (
            songs.length === 0
        ) {

            return;
        }


        let index =
            currentIndex - 1;


        if (
            index < 0
        ) {

            index =
                songs.length - 1;

        }


        loadSong(
            index,
            true
        );

    }
);



/* =========================================================
   NEXT
========================================================= */


nextButton.addEventListener(
    "click",
    function() {


        if (
            songs.length === 0
        ) {

            return;
        }


        let index =
            currentIndex + 1;


        if (
            index >= songs.length
        ) {

            index = 0;

        }


        loadSong(
            index,
            true
        );

    }
);



/* =========================================================
   AUDIO PLAY
========================================================= */


audio.addEventListener(
    "play",
    function() {

        playButton.textContent =
            "❚❚";


        renderSongs(
            selectedAlbum
                ? songs.filter(
                    s =>
                        s.album ===
                        selectedAlbum
                )
                : songs
        );

    }
);



/* =========================================================
   AUDIO PAUSE
========================================================= */


audio.addEventListener(
    "pause",
    function() {

        playButton.textContent =
            "▶";


        renderSongs(
            selectedAlbum
                ? songs.filter(
                    s =>
                        s.album ===
                        selectedAlbum
                )
                : songs
        );

    }
);



/* =========================================================
   AUDIO ENDED
========================================================= */


audio.addEventListener(
    "ended",
    function() {

        let index =
            currentIndex + 1;


        if (
            index >= songs.length
        ) {

            index = 0;

        }


        loadSong(
            index,
            true
        );

    }
);



/* =========================================================
   TIME UPDATE
========================================================= */


audio.addEventListener(
    "timeupdate",
    function() {


        if (
            !audio.duration
        ) {

            return;
        }


        const percent =
            (
                audio.currentTime /
                audio.duration
            ) * 100;


        progress.style.width =
            percent + "%";


        currentTime.textContent =
            formatTime(
                audio.currentTime
            );

    }
);



/* =========================================================
   LOADED METADATA
========================================================= */


audio.addEventListener(
    "loadedmetadata",
    function() {

        duration.textContent =
            formatTime(
                audio.duration
            );


        loading.style.display =
            "none";

    }
);



/* =========================================================
   PROGRESS CLICK
========================================================= */


progressContainer.addEventListener(
    "click",
    function(event) {


        if (
            !audio.duration
        ) {

            return;
        }


        const rect =
            progressContainer
                .getBoundingClientRect();


        const position =
            event.clientX -
            rect.left;


        const percent =
            position /
            rect.width;


        audio.currentTime =
            percent *
            audio.duration;

    }
);



/* =========================================================
   VOLUME
========================================================= */


volume.addEventListener(
    "input",
    function() {

        audio.volume =
            volume.value;

    }
);



/* =========================================================
   SEARCH
========================================================= */


search.addEventListener(
    "input",
    function() {


        const keyword =
            search.value
                .toLowerCase()
                .trim();


        /*
           Kalau sedang memilih album,
           pencarian hanya mencari
           lagu di album tersebut.
        */

        const source =
            selectedAlbum

                ? songs.filter(
                    song =>
                        song.album ===
                        selectedAlbum
                )

                : songs;


        const results =
            source.filter(
                song =>
                    song.title
                        .toLowerCase()
                        .includes(
                            keyword
                        )
            );


        /*
           Kalau user melakukan pencarian
           dari halaman album, tampilkan
           halaman hasil lagu.
        */

        if (
            keyword.length > 0 &&
            !selectedAlbum
        ) {

            albumView.style.display =
                "none";


            songView.style.display =
                "block";


            albumSongTitle.textContent =
                "HASIL PENCARIAN";


            albumSongCount.textContent =
                results.length +
                " MUSIK";

        }


        /*
           Kalau kotak search dikosongkan
           dan tidak sedang di album,
           kembali ke album.
        */

        if (
            keyword.length === 0 &&
            !selectedAlbum
        ) {

            songView.style.display =
                "none";


            albumView.style.display =
                "block";


            renderAlbums();


            return;

        }


        renderSongs(
            results
        );

    }
);



/* =========================================================
   INITIALIZE
========================================================= */


/*
   INI BAGIAN PALING PENTING.

   Ketika halaman dibuka,
   ALBUM LANGSUNG DIRender.
*/

renderAlbums();


</script>


</body>

</html>
