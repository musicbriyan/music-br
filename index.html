<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BR MUSIC — Real Time Spectrum</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#050508;color:#fff}
body{background:radial-gradient(circle at 20% 10%,#40102b33,transparent 35%),radial-gradient(circle at 80% 20%,#002f4030,transparent 35%),#050508}
header{padding:22px;border-bottom:1px solid #ffffff12;background:#050508dd;backdrop-filter:blur(16px);position:sticky;top:0;z-index:5}
.wrap{max-width:1050px;margin:auto}.logo{font-weight:900;letter-spacing:4px;font-size:25px;background:linear-gradient(90deg,#ff0055,#8b2cff,#00eaff);-webkit-background-clip:text;color:transparent}.sub{font-size:9px;letter-spacing:3px;color:#777;margin-top:4px}
main{max-width:1050px;margin:auto;padding:32px 18px 270px}.search{width:100%;height:48px;border-radius:14px;border:1px solid #ffffff12;background:#ffffff08;color:white;padding:0 16px;outline:0}.search:focus{border-color:#00eaff66}
h2{font-size:16px;letter-spacing:1px}.heading{display:flex;justify-content:space-between;align-items:center;margin:28px 0 15px}.count{font-size:9px;color:#777;letter-spacing:2px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.album{min-height:155px;padding:20px;border:1px solid #ffffff12;border-radius:20px;background:linear-gradient(135deg,#ff005515,#7600ff12,#00eaff0d);cursor:pointer;transition:.2s}.album:hover{transform:translateY(-4px);border-color:#00eaff66}.cover{width:58px;height:58px;border-radius:16px;display:grid;place-items:center;font-size:25px;background:linear-gradient(135deg,#ff0055,#7700ff,#00eaff);margin-bottom:18px;box-shadow:0 0 28px #00eaff22}.album b{font-size:14px}.album small{display:block;color:#777;margin-top:7px}
#songsView{display:none}.back{border:0;background:none;color:#00eaff;cursor:pointer;margin-bottom:12px}.list{display:flex;flex-direction:column;gap:8px}.song{display:flex;align-items:center;gap:13px;padding:10px 13px;border:1px solid #ffffff0d;background:#ffffff06;border-radius:13px;cursor:pointer}.song.active{border-color:#00eaff66;background:#00eaff09}.song button{width:40px;height:40px;border:0;border-radius:50%;background:linear-gradient(135deg,#ff0055,#7700ff);color:#fff;cursor:pointer}.info{flex:1;min-width:0}.title{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.track{font-size:9px;color:#666;margin-top:5px;letter-spacing:1px}.mini{display:flex;gap:3px}.mini i{display:block;width:3px;height:9px;background:#00eaff;border-radius:3px;animation:m .65s infinite}.mini i:nth-child(2){animation-delay:.1s}.mini i:nth-child(3){animation-delay:.2s}.mini i:nth-child(4){animation-delay:.3s}@keyframes m{50%{height:23px}}
.visual{position:fixed;left:0;right:0;bottom:120px;height:145px;z-index:3;pointer-events:none;background:linear-gradient(to top,#050508dd,transparent)}canvas{width:100%;height:100%;display:block}
.player{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#050508ee;backdrop-filter:blur(20px);border-top:1px solid #ffffff12;padding:13px 18px 17px}.playerIn{max-width:1050px;margin:auto}.now{text-align:center;color:#777;font-size:9px;letter-spacing:1px;margin-bottom:9px}.now b{color:#00eaff}.bar{display:flex;gap:8px;align-items:center}.time{font-size:9px;color:#777;width:32px;text-align:center}.progressBox{height:5px;flex:1;background:#ffffff12;border-radius:8px;cursor:pointer}.progress{height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#ff0055,#7700ff,#00eaff)}.controls{display:flex;justify-content:center;gap:20px;align-items:center;margin-top:10px}.ctrl{border:0;background:none;color:#fff;font-size:19px;cursor:pointer}.play{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#ff0055,#7700ff,#00eaff);box-shadow:0 0 25px #00eaff22}.vol{position:absolute;right:20px;bottom:22px;color:#888}.vol input{width:85px}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}.vol{display:none}}
@media(max-width:450px){.grid{grid-template-columns:1fr}.visual{height:100px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="logo">BR MUSIC</div><div class="sub">REAL TIME AUDIO VISUALIZER</div></div></header>
<main>
<input id="search" class="search" placeholder="Cari judul musik...">
<section id="albumsView"><div class="heading"><h2>ALBUM MUSIK</h2><span id="albumCount" class="count"></span></div><div id="albums" class="grid"></div></section>
<section id="songsView"><button id="back" class="back">← KEMBALI</button><div class="heading"><h2 id="albumTitle"></h2><span id="songCount" class="count"></span></div><div id="list" class="list"></div></section>
</main>
<div class="visual"><canvas id="spectrum"></canvas></div>
<div class="player"><div class="playerIn">
<div class="now">NOW PLAYING : <b id="now">Belum ada musik</b></div>
<div class="bar"><span id="cur" class="time">0:00</span><div id="progressBox" class="progressBox"><div id="progress" class="progress"></div></div><span id="dur" class="time">0:00</span></div>
<div class="controls"><button id="prev" class="ctrl">⏮</button><button id="play" class="ctrl play">▶</button><button id="next" class="ctrl">⏭</button></div>
<div class="vol">🔊 <input id="volume" type="range" min="0" max="1" step=".01" value=".8"></div>
</div></div>

<script>
const songs=[
 {title:"DJ BOXING88",album:"MUSIC DJ",audio:"https://res.cloudinary.com/seq4ghvg/video/upload/v1786366248/DJ_BOXING88.mp3"},
 {title:"SESI POTRET",album:"MUSIC INDO",audio:"https://res.cloudinary.com/seq4ghvg/video/upload/v1786368037/Ari_Lesmana_-_Sesi_Potret.mp3"},
 {title:"Be Alright",album:"MUSIC INGGRIS",audio:"https://res.cloudinary.com/seq4ghvg/video/upload/v1786368550/Be_Alright.mp3"}
];

const $=id=>document.getElementById(id), audio=new Audio();
audio.preload="auto";audio.crossOrigin="anonymous";audio.volume=.8;
let current=-1,selectedAlbum=null;
let audioCtx=null,analyser=null,source=null,data=null,analyserReady=false;

function fmt(x){return isFinite(x)?Math.floor(x/60)+":"+String(Math.floor(x%60)).padStart(2,"0"):"0:00"}
function albumNames(){return [...new Set(songs.map(x=>x.album))]}

function renderAlbums(){
 $("albums").innerHTML="";
 albumNames().forEach(a=>{
  const n=songs.filter(x=>x.album===a).length;
  const e=document.createElement("div");e.className="album";
  e.innerHTML=`<div class="cover">♫</div><b>${a}</b><small>${n} MUSIK</small>`;
  e.onclick=()=>openAlbum(a);$("albums").appendChild(e);
 });
 $("albumCount").textContent=albumNames().length+" ALBUM";
}
function openAlbum(a){selectedAlbum=a;$("albumsView").style.display="none";$("songsView").style.display="block";$("albumTitle").textContent=a;renderSongs(songs.filter(x=>x.album===a))}
$("back").onclick=()=>{selectedAlbum=null;$("songsView").style.display="none";$("albumsView").style.display="block";renderAlbums()}

function renderSongs(arr){
 $("list").innerHTML="";$("songCount").textContent=arr.length+" MUSIK";
 arr.forEach(s=>{
  const i=songs.indexOf(s),e=document.createElement("div");e.className="song"+(i===current?" active":"");
  e.innerHTML=`<button>${i===current&&!audio.paused?"❚❚":"▶"}</button><div class="info"><div class="title">${s.title}</div><div class="track">TRACK ${String(i+1).padStart(2,"0")}</div></div><div class="mini"><i></i><i></i><i></i><i></i></div>`;
  e.onclick=()=>i===current?toggle():load(i,true);$("list").appendChild(e);
 });
}

async function setupAnalyser(){
 if(analyserReady)return true;
 try{
  audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  analyser=audioCtx.createAnalyser();
  analyser.fftSize=512;
  analyser.minDecibels=-90;
  analyser.maxDecibels=-10;
  analyser.smoothingTimeConstant=.78;
  source=audioCtx.createMediaElementSource(audio);
  source.connect(analyser);analyser.connect(audioCtx.destination);
  data=new Uint8Array(analyser.frequencyBinCount);
  analyserReady=true;
  return true;
 }catch(err){
  console.warn("Web Audio Analyzer tidak tersedia:",err);
  return false;
 }
}

async function load(i,autoplay=false){
 if(i<0||i>=songs.length)return;
 current=i;const s=songs[i];$("now").textContent=s.title;
 audio.pause();audio.src=s.audio;audio.load();
 renderSongs(selectedAlbum?songs.filter(x=>x.album===selectedAlbum):songs);
 if(autoplay){
  try{
   const ok=await setupAnalyser();
   if(audioCtx&&audioCtx.state==="suspended")await audioCtx.resume();
   await audio.play();
  }catch(e){console.error(e);alert("Audio tidak dapat diputar. Jika file bisa diputar di browser tetapi spectrum tidak aktif, Cloudinary perlu mengizinkan CORS.");}
 }
}
async function toggle(){
 if(current<0)return load(0,true);
 if(audio.paused){
  try{if(!analyserReady)await setupAnalyser();if(audioCtx&&audioCtx.state==="suspended")await audioCtx.resume();await audio.play()}catch(e){console.error(e)}
 }else audio.pause();
}
$("play").onclick=toggle;
$("prev").onclick=()=>load((current-1+songs.length)%songs.length,true);
$("next").onclick=()=>load((current+1)%songs.length,true);

audio.onplay=()=>{$("play").textContent="❚❚";renderSongs(selectedAlbum?songs.filter(x=>x.album===selectedAlbum):songs)}
audio.onpause=()=>{$("play").textContent="▶";renderSongs(selectedAlbum?songs.filter(x=>x.album===selectedAlbum):songs)}
audio.onended=()=>load((current+1)%songs.length,true);
audio.onloadedmetadata=()=>$("dur").textContent=fmt(audio.duration);
audio.ontimeupdate=()=>{if(audio.duration){$("cur").textContent=fmt(audio.currentTime);$("progress").style.width=(audio.currentTime/audio.duration*100)+"%"}}
audio.onerror=()=>{$("now").textContent="Gagal memuat musik";console.error("Audio error",audio.error,audio.src)}
$("volume").oninput=e=>audio.volume=e.target.value;
$("progressBox").onclick=e=>{if(audio.duration){const r=e.currentTarget.getBoundingClientRect();audio.currentTime=(e.clientX-r.left)/r.width*audio.duration}};

$("search").oninput=e=>{
 const q=e.target.value.toLowerCase().trim(),base=selectedAlbum?songs.filter(x=>x.album===selectedAlbum):songs,res=base.filter(x=>x.title.toLowerCase().includes(q));
 if(!q&&!selectedAlbum){$("songsView").style.display="none";$("albumsView").style.display="block";renderAlbums();return}
 $("albumsView").style.display="none";$("songsView").style.display="block";$("albumTitle").textContent=selectedAlbum||"HASIL PENCARIAN";renderSongs(res)
};

/* REAL-TIME SPECTRUM */
const canvas=$("spectrum"),ctx=canvas.getContext("2d");
function resize(){const d=Math.min(devicePixelRatio||1,2),r=canvas.getBoundingClientRect();canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
function drawSpectrum(){
 requestAnimationFrame(drawSpectrum);
 const w=canvas.clientWidth,h=canvas.clientHeight;ctx.clearRect(0,0,w,h);
 if(!analyser||!data||audio.paused){return}
 analyser.getByteFrequencyData(data);
 const bars=Math.min(96,Math.max(36,Math.floor(w/12))),gap=3,bw=(w-gap*(bars-1))/bars;
 for(let i=0;i<bars;i++){
  /* log-like frequency mapping: bass gets more visual weight */
  const p=i/(bars-1),idx=Math.floor(Math.pow(p,1.65)*(data.length-1));
  const v=data[idx]/255;
  const bh=Math.max(3,v*h*.96),x=i*(bw+gap),y=h-bh;
  const g=ctx.createLinearGradient(0,y,0,h);g.addColorStop(0,"#00eaff");g.addColorStop(.45,"#8b2cff");g.addColorStop(1,"#ff0055");
  ctx.fillStyle=g;ctx.shadowBlur=12;ctx.shadowColor="#00eaff";
  if(ctx.roundRect){ctx.beginPath();ctx.roundRect(x,y,bw,bh,3);ctx.fill()}else ctx.fillRect(x,y,bw,bh);
 }
 ctx.shadowBlur=0;
}
window.onresize=resize;resize();drawSpectrum();renderAlbums();
</script>
</body>
</html>
